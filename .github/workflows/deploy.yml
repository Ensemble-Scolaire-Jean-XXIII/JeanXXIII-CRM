name: CD - Deploy CRM Production

on:
  push:
    branches:
      - main

jobs:
  deploy_prod:
    runs-on: self-hosted
    steps:
      - name: Pull latest code and rebuild production
        run: |
          cd /home/jeanxxiii-apps/jeanxxiii-crm

          git pull origin main

          make prod-down

          docker compose -f docker-compose.prod.yml build --no-cache

          make prod-up

          # Re-resolve upstream names (container IPs change on rebuild)
          docker exec nginx-proxy-prod nginx -s reload

          docker image prune -f
